name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Tests del núcleo (Linux, sin GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build ${{ matrix.artifact }}
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: qr2stl-windows-x64
          - os: macos-latest
            artifact: qr2stl-macos-arm64
          - os: macos-15-intel
            artifact: qr2stl-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[gui,dev,build]"

      - name: Tests (GUI offscreen)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      # PyInstaller + poda de Qt + --selftest del ejecutable + zip
      - name: Empaquetar
        run: python tools/build_app.py --zip ${{ matrix.artifact }}

      # archive: false sube el .zip tal cual (sin otro zip alrededor); el artifact se
      # llama como el archivo
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact }}.zip
          archive: false
          if-no-files-found: error

  # Siempre junta los zips y verifica que estén los tres; solo publica con un tag v*
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Verificar zips
        run: |
          ls -la dist
          for a in qr2stl-windows-x64 qr2stl-macos-arm64 qr2stl-macos-x86_64; do
            unzip -tq "dist/$a.zip" || { echo "falta o está roto: $a.zip"; exit 1; }
          done
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          generate_release_notes: true
