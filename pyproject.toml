[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qr2stl"
version = "0.1.0"
description = "Genera un STL imprimible de un código QR a partir de una URL"
requires-python = ">=3.10"
dependencies = ["qrcode>=7.4"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
qr2stl = "qr2stl.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
