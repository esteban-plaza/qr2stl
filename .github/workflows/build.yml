name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-core:
    name: Tests del núcleo (Linux, sin GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build ${{ matrix.artifact }}
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: qr2stl-windows-x64
          - os: macos-latest
            artifact: qr2stl-macos-arm64
          - os: macos-15-intel
            artifact: qr2stl-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gui,dev,build]"
      - name: Tests (con GUI offscreen)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: PyInstaller (Windows, onefile)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name qr2stl src/qr2stl/__main__.py
          $p = Start-Process dist/qr2stl.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest falló: $($p.ExitCode)" }
          Compress-Archive dist/qr2stl.exe ${{ matrix.artifact }}.zip

      - name: PyInstaller (macOS, .app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name qr2stl \
            --osx-bundle-identifier io.github.esteban-plaza.qr2stl src/qr2stl/__main__.py
          dist/qr2stl.app/Contents/MacOS/qr2stl --selftest
          ditto -c -k --sequesterRsrc --keepParent dist/qr2stl.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
